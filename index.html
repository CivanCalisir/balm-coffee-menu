<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Balm Coffee Menu</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="menu-header">
        <div class="lang-switch">
            <button id="lang-tr" class="lang-btn active">🇹🇷 TR</button>
            <button id="lang-en" class="lang-btn">🇬🇧 EN</button>
        </div>
        
        <h1>Balm Coffee</h1>
        <p class="dynamic-greeting" id="greeting-text">Premium Kahve Deneyimi</p>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Kahve, içerik veya kategori ara...">
        </div>
    </header>
    <nav class="category-nav" id="category-nav"></nav>
    <main class="menu-container" id="menu-container"></main>
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal-btn">&times;</span>
            
            <div class="modal-img-placeholder" id="modal-icon">☕</div>
            <img src="" id="modal-img" class="modal-img" alt="Ürün Görseli">
            
            <h2 class="modal-title" id="modal-title">Ürün Adı</h2>
            <p class="modal-desc" id="modal-desc">İçerik açıklaması burada yer alacak.</p>
            <p class="item-meta" id="modal-meta" style="display:inline-block; margin-bottom:15px;">🔥 <span id="modal-cal-text">Kalori</span></p>
            <div class="modal-price" id="modal-price">0 ₺</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
